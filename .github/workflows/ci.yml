# Every change is checked on Windows and on Linux. A change that fails on either is not finished.
# The portable packages built here are kept as downloads on the run's page, so the author can try each change.
name: CI

on:
  push:
  pull_request:

# The build of the newest green change is published as a release, so it can be fetched without signing in — the
# author should never have to visit a web page to get the program they just asked for.
permissions:
  contents: write

jobs:
  check:
    strategy:
      # Both systems finish even if one fails, so a failure on one never hides the state of the other.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # Every build says which build it is, in Help ▸ About: 0.0.<this run's number>.
      - name: Number this build
        run: node scripts/set-version.mjs ${{ github.run_number }}

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Licenses
        run: npm run licenses

      # What we ship is only as sound as what it is built from: every run asks whether anything in it is known to be
      # vulnerable. High or worse stops the build.
      - name: Known vulnerabilities
        run: npm run audit

      - name: Build
        run: npm run build

      # Ubuntu blocks the unprivileged namespaces Chromium's sandbox is built on, so Electron cannot start its sandbox
      # on a stock build machine. Allowing them here keeps the sandbox on in every test rather than switching it off.
      - name: Allow Chromium's sandbox (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: End-to-end tests (Linux, on a virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npx playwright test

      - name: End-to-end tests (Windows)
        if: runner.os == 'Windows'
        run: npx playwright test

      - name: Keep the traces of failed end-to-end tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: end-to-end-traces-${{ runner.os }}
          path: test-results/
          if-no-files-found: ignore

      # The dictionaries shipped with the program, fetched once here rather than by the author's copy later.
      - name: Fetch the spelling dictionaries
        run: node scripts/fetch-dictionaries.mjs

      - name: Package (portable)
        run: npx electron-builder --publish never

      # GitHub zips every download itself, so the Windows package is uploaded unpacked: one unzip then gives the
      # folder with Insanity_Loom.exe in it, rather than a zip inside a zip. The Linux AppImage is a single file.
      - name: Keep the portable package
        uses: actions/upload-artifact@v7
        with:
          name: Insanity_Loom-${{ runner.os }}
          path: |
            dist/win-unpacked/**
            dist/*.AppImage
          if-no-files-found: error

      # The Windows package, as one zip, for the release below. GitHub's own artifact downloads need signing in;
      # a release asset does not, so whoever wants the newest build — the author, or the assistant fetching it for
      # them — can simply take it.
      - name: Gather the Windows package for release
        if: runner.os == 'Windows' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: Compress-Archive -Path dist/win-unpacked/* -DestinationPath dist/Insanity_Loom-Windows.zip -Force

      # The program's own part, on its own: app.asar, the dictionary and the notices — a few megabytes against the
      # whole program's hundred and fifty, and all that changes between one build and the next. A running copy fetches
      # this one to update itself (src/main/updates.ts).
      - name: Gather the program's own part (Windows)
        if: runner.os == 'Windows' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $ours = 'dist/win-unpacked/resources/app.asar', 'dist/win-unpacked/resources/dictionaries',
                  'dist/win-unpacked/LICENSE', 'dist/win-unpacked/NOTICE', 'dist/win-unpacked/THIRD_PARTY_NOTICES.txt'
          Compress-Archive -Path $ours -DestinationPath dist/Insanity_Loom-Windows-app.zip -Force

      # Both packages are named for what they are rather than for which build they came from, so the newest replaces
      # the last rather than joining a pile of them. Which build it is, is in Help ▸ About and in the release's notes.
      - name: Gather the Linux package for release
        if: runner.os == 'Linux' && github.ref == 'refs/heads/main'
        run: mv dist/*.AppImage dist/Insanity_Loom-Linux.AppImage

      - name: Say what this build published
        if: github.ref == 'refs/heads/main'
        run: >
          node scripts/gather-packages.mjs dist/win-unpacked dist 0.0.${{ github.run_number }}
          $(node -p "require('./package.json').devDependencies.electron")

      - name: Publish the newest build
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: newest
          name: The newest build — 0.0.${{ github.run_number }}
          body: |
            Version 0.0.${{ github.run_number }}, built from ${{ github.sha }}, which passed every check on Windows
            and on Linux.
            This release is replaced by each newer green build; older builds are the runs' own downloads.
          prerelease: true
          files: |
            dist/Insanity_Loom-Windows.zip
            dist/Insanity_Loom-Windows-app.zip
            dist/Insanity_Loom-Linux.AppImage
            dist/newest.json
