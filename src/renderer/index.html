<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The page may load only its own scripts and styles, and reach nothing outside itself. Styles allow inline use
         because the development server injects them; scripts never do. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <title>Insanity_Loom</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <nav id="menubar" class="menubar"></nav>
    <main id="loom" class="loom">
      <div id="conversation" class="conversation" aria-label="Conversation" aria-live="polite"></div>
      <textarea
        id="compose"
        class="compose"
        aria-label="Write here"
        placeholder="Write here. A line with only --- (then Enter) sends everything above it. Ctrl+Enter sends it all."
      ></textarea>
    </main>
    <footer class="status">
      <span id="status-text" class="status-text" role="status">Starting…</span>
      <button id="reconnect" class="status-action" type="button" hidden>Reconnect</button>
      <button id="connection-settings" class="status-action" type="button">Connection Settings…</button>
    </footer>
    <dialog id="resume-dialog" class="resume-dialog" aria-label="Resume a conversation"></dialog>
    <dialog id="connection-dialog" class="panel-dialog"></dialog>
    <dialog id="preferences-dialog" class="panel-dialog"></dialog>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
