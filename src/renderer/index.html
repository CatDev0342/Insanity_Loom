<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The page may load only its own scripts and styles, and reach nothing outside itself. Styles allow inline use
         because the development server injects them; scripts never do. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <title>Insanity_Loom</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <nav id="menubar" class="menubar"></nav>
    <main id="loom" class="loom">
      <div id="asks" class="asks" hidden></div>
      <div id="find-bar" class="find-bar" role="search" aria-label="Find in this whisper" hidden>
        <div class="find-row">
          <label for="find-looked">Find:</label>
          <input id="find-looked" type="search" spellcheck="false" />
          <span id="find-said" class="find-said" role="status"></span>
          <button id="find-previous" class="find-step" type="button" aria-label="Find previous">▲</button>
          <button id="find-next" class="find-step" type="button" aria-label="Find next">▼</button>
          <button id="find-close" class="find-step" type="button" aria-label="Close find">✕</button>
        </div>
        <div id="find-replace-row" class="find-row" hidden>
          <label for="find-replacement">Replace with:</label>
          <input id="find-replacement" type="text" spellcheck="false" />
          <button id="find-replace" type="button">Replace</button>
          <button id="find-replace-all" type="button">Replace All</button>
        </div>
      </div>
      <div class="whisper-scroll">
        <div id="whisper" class="whisper-host"></div>
      </div>
    </main>
    <footer class="status">
      <span id="whisper-name" class="status-whisper" aria-label="Whisper"></span>
      <span id="status-text" class="status-text" role="status">Starting…</span>
      <span id="activity" class="status-activity" aria-live="polite"></span>
      <span id="account" class="status-account" aria-label="Signed in as"></span>
      <label id="mode-label" class="status-mode" for="mode" hidden>
        Mode:
        <select id="mode" class="status-mode-choice"></select>
      </label>
      <button id="reconnect" class="status-action" type="button" hidden>Reconnect</button>
      <button id="sign-in" class="status-action" type="button" hidden>Sign In…</button>
      <button id="connection-settings" class="status-action" type="button">Connection Settings…</button>
    </footer>
    <dialog id="resume-dialog" class="resume-dialog" aria-label="Resume a conversation"></dialog>
    <dialog id="connection-dialog" class="panel-dialog"></dialog>
    <dialog id="preferences-dialog" class="panel-dialog"></dialog>
    <dialog id="sign-in-dialog" class="panel-dialog"></dialog>
    <dialog id="link-dialog" class="panel-dialog"></dialog>
    <dialog id="points-here-dialog" class="panel-dialog"></dialog>
    <dialog id="search-dialog" class="panel-dialog"></dialog>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
